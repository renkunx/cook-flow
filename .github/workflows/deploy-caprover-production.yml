name: Deploy to CapRover - Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 等待并验证镜像可用
      - name: Wait for image to be available
        run: |
          echo "Waiting for image ipusi/cook-flow:latest to be available..."
          timeout=300
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if docker pull ipusi/cook-flow:latest 2>/dev/null; then
              echo "Image is available!"
              break
            fi
            echo "Image not ready, waiting 10 seconds..."
            sleep 10
            elapsed=$((elapsed + 10))
          done
          if [ $elapsed -ge $timeout ]; then
            echo "Timeout waiting for image"
            exit 1
          fi

      # 部署到 CapRover
      - name: Deploy to CapRover Production
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: '${{ secrets.CAPROVER_SERVER_PROD }}'
          app: '${{ secrets.APP_NAME_PROD }}'
          token: '${{ secrets.APP_TOKEN_PROD }}'
          image: 'ipusi/cook-flow:latest'
